[server]
listen = "0.0.0.0"
port = 8201
# Behind the gateway, take the client IP from the rightmost X-Forwarded-For entry.
# behind_proxy = true

[db]
# Overridable with USER_API_DB__URL. The micro cluster from `just pg-micro-up`.
url = "postgres://postgres:postgres@localhost:5433/user_api"
# max_connections = 20

# Registration creates the profile here; see README "Internal endpoints".
[profile_api]
url = "http://localhost:8202"

# Failed-login limits per 60 s window; 0 disables a limiter.
# [throttle]
# email_failures_per_minute = 5
# ip_failures_per_minute = 20
