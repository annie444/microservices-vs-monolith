[server]
listen = "0.0.0.0"
port = 8202
# behind_proxy = true

[db]
# Overridable with PROFILE_API_DB__URL.
url = "postgres://postgres:postgres@localhost:5433/profile_api"
# max_connections = 20

# Session verification: the user database, as the role that can only call verify_session().
[auth_db]
url = "postgres://session_verifier:verifier@localhost:5433/user_api"
max_connections = 8

# Follow/unfollow events are streamed here (POST /internal/follow-events); see README.
[article_api]
url = "http://localhost:8203"
